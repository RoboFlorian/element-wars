<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048元素战争</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="fx-hurt-veil" id="fx-hurt-veil" aria-hidden="true"></div>

  <div id="tutorial-overlay" class="tutorial-overlay" hidden>
    <div class="tutorial-shade" id="tutorial-shade-top"></div>
    <div class="tutorial-shade" id="tutorial-shade-left"></div>
    <div class="tutorial-shade" id="tutorial-shade-right"></div>
    <div class="tutorial-shade" id="tutorial-shade-bottom"></div>
    <div class="tutorial-frame" id="tutorial-frame"></div>
    <div class="tutorial-tip" id="tutorial-tip">
      <p class="tutorial-step" id="tutorial-step">1 / 8</p>
      <p class="tutorial-text" id="tutorial-text"></p>
      <div class="tutorial-actions">
        <button type="button" class="btn btn-tiny btn-primary" id="tutorial-next" hidden>下一步</button>
        <button type="button" class="btn btn-tiny" id="tutorial-skip">跳过试玩</button>
      </div>
    </div>
  </div>

  <main id="app">
    <section id="menuscene" class="scene scene-menu" hidden>
      <h1 class="logo menu-logo">
        <span class="menu-logo-num">2048</span><span class="el-water">元</span><span class="el-fire">素</span><span class="el-earth">战</span><span class="el-wind">争</span>
      </h1>
      <button type="button" class="btn btn-primary menu-start" id="menu-start">开始游戏</button>
    </section>

    <section id="gamescene" class="scene scene-game" hidden>
      <div class="game-wrap">
        <div class="game-upper">
          <div class="game-hud">
            <button type="button" class="btn btn-tiny" id="game-menu">菜单</button>
            <div class="score-card time-card">
              <span>波次</span>
              <strong id="game-wave">1</strong>
            </div>
            <button type="button" class="btn btn-tiny btn-primary" id="game-restart">重开</button>
          </div>

          <div class="monster-stage">
            <div class="hp-row monster-hp">
              <span id="monster-name">黑团团</span>
              <div class="hp-bar"><i id="monster-hp-fill"></i></div>
              <strong id="monster-hp-text">0</strong>
            </div>
            <div class="monster-circle" id="monster">
              <img src="img/monster.png" alt="元素怪物">
              <div class="monster-ring" aria-hidden="true"></div>
            </div>
            <p class="monster-element" id="monster-element">
              <span class="element-badge" data-element="water">水</span>
            </p>
            <p class="monster-curses" id="monster-curses" hidden></p>
            <p class="attack-line" id="monster-attack-line">
              <span class="attack-cd" id="monster-attack-cd">0 回合后攻击</span>
              <span class="attack-dot">·</span>
              <span>伤害 <strong id="monster-attack-dmg">0</strong></span>
            </p>
          </div>
        </div>

        <div class="game-lower" id="game-lower">
          <div class="player-zone player-zone-stats" id="player-zone-stats">
            <div class="hp-row player-hp">
              <span class="player-label"><b class="player-level">Lv<em id="player-level">1</em></b>生命</span>
              <div class="hp-bar"><i id="player-hp-fill"></i></div>
              <strong id="player-hp-text">100</strong>
              <span class="player-guard" title="元素护盾：左边的最先挨打">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20 5V11C20 16.3 16.6 20.4 12 22 7.4 20.4 4 16.3 4 11V5Z"/></svg>
                <span class="guard-list" id="player-guard-list"><em class="guard-empty">0</em></span>
              </span>
            </div>
            <p class="settle-line" id="settle-line"><span class="settle-text">拖到怪物攻击，拖到血条加盾<span class="settle-next" id="settle-next"></span></span><span class="settle-notice">本轮元素已用完，即将刷新元素顺序</span></p>
          </div>

          <div class="player-zone player-zone-stage" id="player-zone-stage">
            <div class="stage-track" id="stage-track">
              <div class="stage-panel" data-panel="blessings" id="panel-blessings">
                <p class="stage-empty" id="panel-blessings-empty">还没有获得祝福</p>
                <ul class="owned-blessing-list" id="owned-blessing-list"></ul>
              </div>
              <div class="stage-panel is-active" data-panel="board" id="panel-board">
                <div class="board" id="game-board">
                  <span class="board-rim board-rim-top" aria-hidden="true"></span>
                  <span class="board-rim board-rim-right" aria-hidden="true"></span>
                  <span class="board-rim board-rim-bottom" aria-hidden="true"></span>
                  <span class="board-rim board-rim-left" aria-hidden="true"></span>
                  <div class="board-grid" id="game-grid"></div>
                  <div class="board-tiles" id="game-tiles"></div>
                </div>
              </div>
              <div class="stage-panel" data-panel="items" id="panel-items">
                <p class="stage-empty">暂无道具</p>
              </div>
            </div>
          </div>

          <div class="player-zone player-zone-actions" id="player-zone-actions">
            <button type="button" class="tab-btn" data-tab="blessings" id="tab-blessings">祝福</button>
            <button type="button" class="tab-btn is-active" data-tab="board" id="tab-board" disabled aria-current="page">战斗盘</button>
            <button type="button" class="tab-btn" data-tab="items" id="tab-items">道具</button>
          </div>
        </div>
      </div>
    </section>

    <section id="blessingscene" class="scene scene-blessing" hidden>
      <div class="blessing-shell">
        <p class="eyebrow blessing-text" id="blessing-eyebrow">击败奖励</p>
        <h1 class="blessing-title blessing-text" id="blessing-title">选一个祝福</h1>
        <p class="tagline blessing-text" id="blessing-tagline">三选一，效果马上生效</p>
        <div class="blessing-cards" id="blessing-cards"></div>
      </div>
    </section>

    <section id="resultscene" class="scene" hidden>
      <div class="panel result-panel">
        <p class="eyebrow" id="result-eyebrow">本局结束</p>
        <h1 class="result-title" id="result-title">你倒下了</h1>
        <p class="result-desc" id="result-desc">生命耗尽，怪物把你打停了。</p>

        <div class="result-tile" id="result-tile">0:00</div>

        <div class="result-stats">
          <div>
            <span>存活时间</span>
            <strong id="result-time">0:00</strong>
          </div>
          <div>
            <span>最高波次</span>
            <strong id="result-best">1</strong>
          </div>
          <div>
            <span>坚持波次</span>
            <strong id="result-wave">1</strong>
          </div>
          <div>
            <span>造成伤害</span>
            <strong id="result-score">0</strong>
          </div>
        </div>

        <div class="btn-stack">
          <button type="button" class="btn btn-primary" id="result-primary">再来一局</button>
          <button type="button" class="btn btn-ghost" id="result-secondary">返回菜单</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/elements.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/player.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/blockspawn.js"></script>
  <script src="js/elementshields.js"></script>
  <script src="js/blessings.js"></script>
  <script src="js/curses.js"></script>
  <script src="js/monsters.js"></script>
  <script src="js/gameengine.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tutorialguide.js"></script>
  <script src="js/menuscene.js"></script>
  <script src="js/gamescene.js"></script>
  <script src="js/blessingscene.js"></script>
  <script src="js/resultscene.js"></script>
</body>
</html>
